name = "greys-network-relay"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
# Comma-separated. The worker refuses POSTs from anywhere else, so the endpoint
# cannot be driven from a random page someone sets up.
ALLOWED_ORIGIN = "https://greys-network-4bb08f.gitlab.io"

# Optional rate-limit store. Create with:
#   wrangler kv namespace create RATE
# then paste the id below and uncomment. Without it the worker still files
# reports, it just stops counting -- a broken limiter should not silence
# genuine feedback.
# [[kv_namespaces]]
# binding = "RATE"
# id = "paste-the-id-here"

# GITLAB_TOKEN is a SECRET, never a var. Set it with:
#   wrangler secret put GITLAB_TOKEN
